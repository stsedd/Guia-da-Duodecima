name: Nazzano P0 smoke
on:
  push:
    branches: [preview/nazzano-roma-p0-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check guide-nazzano-integrated.js && node --check scripts/nazzano-p0-smoke.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/guia-nazzano-http.log 2>&1 &
          sleep 2
      - run: node scripts/nazzano-p0-smoke.mjs
