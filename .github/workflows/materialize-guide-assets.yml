name: Materialize guide image assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/manifest-v261.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize original combat banners
        shell: bash
        run: |
          set -euo pipefail
          test -f .asset-staging/manifest-v261.txt || exit 0
          mkdir -p assets/visual
          cat .asset-staging/combat-main.*.b64 | base64 -d > assets/visual/banner-combate-hires.webp
          cat .asset-staging/combat-rolls.*.b64 | base64 -d > assets/visual/banner-combate-rolagens-hires.webp
          cat .asset-staging/combat-turn.*.b64 | base64 -d > assets/visual/banner-combate-turno-hires.webp
          cat .asset-staging/combat-attack-defense.*.b64 | base64 -d > assets/visual/banner-combate-ataque-defesa-hires.webp
          file assets/visual/banner-combate-hires.webp
          file assets/visual/banner-combate-rolagens-hires.webp
          file assets/visual/banner-combate-turno-hires.webp
          file assets/visual/banner-combate-ataque-defesa-hires.webp
          rm -rf .asset-staging

      - name: Commit materialized assets
        shell: bash
        run: |
          if git diff --quiet -- assets/visual .asset-staging; then
            echo 'Nada a materializar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/visual .asset-staging
          git commit -m 'assets: restore high-quality combat banners'
          git push
