name: Visual smoke · Guia

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v24.js'
      - 'styles-v24.css'
      - 'core-bridge-v24.js'
      - 'lineage-core-v25.js'
      - 'guide-stabilization-v251.js'
      - 'guide-rules-v26.js'
      - 'guide-layout-v261.css'
      - 'guide-layout-v262.css'
      - 'guide-combat-layout-v262.js'
      - 'guide-visual-v253.js'
      - 'guide-visual-v253.css'
      - 'assets/visual/banner-combate*.avif'
      - '.github/workflows/visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4174 >/tmp/duodecima-guide-http.log 2>&1 &
          sleep 2
      - name: Capture guide pages
        run: |
          mkdir -p visual-artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const capture=async(viewport,label,mobile=false)=>{
            const context=await browser.newContext({viewport,isMobile:mobile});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`${label}: ${e.message}`));
            await page.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle'});
            await page.screenshot({path:`visual-artifacts/${label}-home.png`,fullPage:true});
            for(const section of ['sistema','combate','crafting','roma','magia','deuses']){
              const nav=page.locator(`[data-page="${section}"]`).first();
              if(await nav.count()){
                await nav.click({force:true});
                await page.waitForTimeout(220);
                if(section==='combate'){
                  const stats=await page.evaluate(()=>({
                    banners:document.querySelectorAll('.rules-page-banner,.rules-banner').length,
                    main:!!document.querySelector('.rules-page-banner--main'),
                    attackDefense:!!document.querySelector('.rules-attack-defense-grid'),
                    overflow:document.documentElement.scrollWidth>window.innerWidth+2
                  }));
                  if(!stats.main)errors.push(`${label}: combate sem banner principal`);
                  if(stats.banners<4)errors.push(`${label}: combate esperava ao menos 4 banners, encontrou ${stats.banners}`);
                  if(!stats.attackDefense)errors.push(`${label}: bloco Ataque & Defesa não foi reorganizado`);
                  if(stats.overflow)errors.push(`${label}: combate com overflow horizontal`);
                }
                await page.screenshot({path:`visual-artifacts/${label}-${section}.png`,fullPage:true});
              }
            }
            await context.close();
          };
          await capture({width:1440,height:1100},'desktop');
          await capture({width:390,height:844},'mobile',true);
          await browser.close();
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guia-visual-smoke
          path: visual-artifacts
          if-no-files-found: error
