name: Visual smoke · Guia

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v24.js'
      - 'styles-v24.css'
      - 'core-bridge-v24.js'
      - 'lineage-core-v25.js'
      - 'guide-stabilization-v251.js'
      - 'guide-rules-v26.js'
      - 'guide-layout-v261.css'
      - 'guide-layout-v262.css'
      - 'guide-combat-layout-v262.js'
      - 'guide-visual-v253.js'
      - 'guide-visual-v253.css'
      - 'assets/visual/banner-combate*.avif'
      - '.github/workflows/visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4174 >/tmp/duodecima-guide-http.log 2>&1 &
          sleep 2
      - name: Capture guide pages
        run: |
          mkdir -p visual-artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const capture=async(viewport,label,mobile=false)=>{
            const context=await browser.newContext({viewport,isMobile:mobile});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`${label}: ${e.message}`));
            await page.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle'});
            await page.screenshot({path:`visual-artifacts/${label}-home.png`,fullPage:true});
            for(const section of ['sistema','combate','crafting','roma','magia','deuses']){
              const nav=page.locator(`[data-page="${section}"]`).first();
              if(await nav.count()){
                await nav.click({force:true});
                await page.waitForTimeout(260);
                if(section==='combate'){
                  const stats=await page.evaluate(()=>({
                    banners:document.querySelectorAll('.rules-page-banner,.rules-banner').length,
                    main:document.querySelectorAll('.rules-page-banner--main').length,
                    rolls:document.querySelectorAll('#rolagens > .rules-banner').length,
                    turn:document.querySelectorAll('#turno > .rules-banner').length,
                    attackDefense:document.querySelectorAll('#rolagens .rules-subfeature > .rules-banner').length,
                    mainSrc:document.querySelector('.rules-page-banner--main img')?.getAttribute('src')||'',
                    emptyCards:[...document.querySelectorAll('.rules-section .paper-card')].filter(card=>(card.textContent||'').trim().length<3).length,
                    hugeCards:[...document.querySelectorAll('.rules-section .paper-card')].filter(card=>card.getBoundingClientRect().height>600).length,
                    overflow:document.documentElement.scrollWidth>window.innerWidth+2
                  }));
                  if(stats.main!==1)errors.push(`${label}: combate esperava 1 banner principal, encontrou ${stats.main}`);
                  if(stats.rolls!==1)errors.push(`${label}: Tipos de Rolagens esperava 1 banner, encontrou ${stats.rolls}`);
                  if(stats.turn!==1)errors.push(`${label}: Durante o Turno esperava 1 banner, encontrou ${stats.turn}`);
                  if(stats.attackDefense!==1)errors.push(`${label}: Ataque & Defesa esperava 1 banner, encontrou ${stats.attackDefense}`);
                  if(stats.banners!==4)errors.push(`${label}: combate esperava exatamente 4 banners, encontrou ${stats.banners}`);
                  if(!stats.mainSrc.endsWith('assets/visual/banner-combate.webp'))errors.push(`${label}: banner principal não usa a arte original de Combate (${stats.mainSrc})`);
                  if(stats.emptyCards)errors.push(`${label}: combate encontrou ${stats.emptyCards} cards vazios`);
                  if(stats.hugeCards)errors.push(`${label}: combate encontrou ${stats.hugeCards} cards anormalmente altos`);
                  if(stats.overflow)errors.push(`${label}: combate com overflow horizontal`);
                }
                await page.screenshot({path:`visual-artifacts/${label}-${section}.png`,fullPage:true});
              }
            }
            await context.close();
          };
          await capture({width:1440,height:1100},'desktop');
          await capture({width:390,height:844},'mobile',true);
          await browser.close();
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guia-visual-smoke
          path: visual-artifacts
          if-no-files-found: error
