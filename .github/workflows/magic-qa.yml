name: Auditoria visual de Magia
on:
  push:
    branches: [main]
    paths:
      - 'scripts/magic-qa.mjs'
      - '.github/workflows/magic-qa.yml'
      - 'guide-magic-v279.js'
      - 'guide-magic-v279.css'
      - 'guide-domus-v275.js'
      - 'index.html'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  magic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/magic-test.log 2>&1 &
          sleep 2
      - run: node scripts/magic-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magia-auditoria-visual
          path: magic-artifacts
          if-no-files-found: ignore
