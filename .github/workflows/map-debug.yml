name: Diagnóstico do mapa do Guia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/map-debug.mjs'
      - '.github/workflows/map-debug.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/map-debug.log 2>&1 &
          sleep 2
      - run: node scripts/map-debug.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapa-diagnostico
          path: map-debug-artifacts
          if-no-files-found: ignore
