name: Guia · Auditoria de integridade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/site-audit.mjs'
      - '.github/workflows/site-integrity-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 > /tmp/guia-audit-server.log 2>&1 &
          sleep 2
      - run: node scripts/site-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integridade-guia
          path: site-audit
          if-no-files-found: ignore
