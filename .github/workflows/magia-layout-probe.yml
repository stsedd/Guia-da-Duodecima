name: Inspecao Magia
on:
  workflow_dispatch:
  push:
    paths: ['scripts/magia-layout-probe.mjs','.github/workflows/magia-layout-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/magia-site.log 2>&1 &
          sleep 2
      - run: node scripts/magia-layout-probe.mjs
